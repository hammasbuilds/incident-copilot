[project]
name = "incident-copilot"
version = "0.1.0"
description = "AIOps: log template extraction, robust anomaly detection, incident correlation and change attribution."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# No numpy, no scipy. These are medians and subtractions.
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
# so `pytest` works in a fresh clone, with nothing installed
pythonpath = ["src"]
testpaths = ["tests"]
